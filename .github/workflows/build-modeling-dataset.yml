name: Build Bitfinex modeling dataset

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitfinex-repository-writer
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install modeling dependencies
        run: python -m pip install -e ".[test,modeling]"

      - name: Run offline tests
        run: python -m pytest -q

      - name: Build modeling dataset
        run: python -m bitfinex_lending.modeling

      - name: Commit modeling outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/modeling
          if git diff --cached --quiet; then
            echo "No modeling output changes to commit"
            exit 0
          fi
          modeled_at="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "data: rebuild modeling dataset at ${modeled_at} [skip ci]"
          if ! git push; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
